    <!-- تسجيل Service Worker (تثبيت التطبيق) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function () { });
            });
        }

        // نحفظ حدث التثبيت فوراً (قبل ما React يشتغل) عشان مايضيعش أبداً
        window.__pwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__pwaPrompt = e;
        });
        window.addEventListener('appinstalled', function () {
            window.__pwaPrompt = null;
            window.__pwaInstalled = true;
        });
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                        script: ['Great Vibes', 'cursive'],
                    },
                    colors: {
                        romantic: {
                            50: '#fff1f2',

    </script>

    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-color: #020617; /* Night Sky Base */
            color: #f8fafc;

        /* ========== دعم كل المقاسات ========== */

        /* ========== مسافة آمنة للأزرار العائمة ========== */

        }

        .safe-bl {

        }

        /* ========== تثبيت التطبيق — مسافة آمنة ========== */

        .glass-panel {

        /* New Animations Additions */
        @keyframes slideDownNotif {
            0% { transform: translate(-50%, -150%); opacity: 0; }
            10% { transform: translate(-50%, 0); opacity: 1; }
            90% { transform: translate(-50%, 0); opacity: 1; }

        .notification-anim {
            animation: slideDownNotif 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes twinkle {

        .shooting-star {

        @keyframes popOutAndFade {
            0% { transform: scale(0.5) translateY(0); opacity: 1; }

            content: '';

            background: linear-gradient(45deg, #e11d48, #9333ea, #3b82f6, #e11d48);

            100% { filter: blur(10px); }

        /* ========== ظرف الرسالة الفاخر ========== */
        .envelope-stage {
            perspective: 1600px;
            perspective-origin: 50% 40%;
        }

        .envelope-wrap {
            transform-style: preserve-3d;
            transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
            transform: rotateX(6deg);
        }

        .envelope-wrap.opened {
            transform: rotateX(0deg) translateY(-14px) scale(1.02);
        }

        /* جسم الظرف — جلد مخملي */
        .envelope-body {
            background:
                linear-gradient(160deg, #f9a8c0 0%, #f472a4 22%, #e8558f 48%, #be2f6b 78%, #8f1d4e 100%);
            box-shadow:
                0 40px 80px -20px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.18) inset,
                0 2px 0 rgba(255, 255, 255, 0.35) inset,
                0 -18px 40px rgba(90, 10, 45, 0.55) inset;
        }

        /* لمعة بتتحرك على الظرف */
        .envelope-body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.45) 48%, transparent 62%);
            transform: translateX(-130%);
            pointer-events: none;
            opacity: 0.9;
        }

        .envelope-wrap.opened .envelope-body::after {
            animation: envelopeShine 1.5s ease-out 1;
        }

        @keyframes envelopeShine {
            0% { transform: translateX(-130%); }
            100% { transform: translateX(130%); }
        }

        /* البطاقة اللي جوه */
        .envelope-card {
            background:
                linear-gradient(170deg, #fffdfa 0%, #fff7f8 40%, #ffeef2 100%);
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(244, 63, 94, 0.14);
        }

        /* flap بتاع الظرف */
        .envelope-flap {
            background: linear-gradient(180deg, #f472a4 0%, #db2777 55%, #9d174d 100%);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 1px 0 rgba(255, 255, 255, 0.4) inset;
            transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1), opacity 1s ease;
            transform-origin: top center;
        }

        .envelope-wrap.opened .envelope-flap {
            transform: rotateX(178deg);
            opacity: 0;
        }

        /* الجزء السفلي من الظرف */
        .envelope-pocket {
            background: linear-gradient(175deg, #e8558f 0%, #be2f6b 55%, #8f1d4e 100%);
            box-shadow:
                0 -2px 0 rgba(255, 255, 255, 0.25) inset,
                0 30px 60px -12px rgba(0, 0, 0, 0.7);
        }

        /* الختم (الجوة) */
        .envelope-seal {
            background: radial-gradient(circle at 32% 28%, #ffd9e3 0%, #f43f5e 42%, #9f1239 100%);
            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.22),
                0 0 26px rgba(244, 63, 94, 0.85),
                0 8px 18px rgba(0, 0, 0, 0.5);
            animation: sealPulse 2.4s ease-in-out infinite;
        }

        @keyframes sealPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 4px rgba(255,255,255,0.22), 0 0 26px rgba(244,63,94,0.85), 0 8px 18px rgba(0,0,0,0.5); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(255,255,255,0.3), 0 0 42px rgba(244,63,94,1), 0 8px 22px rgba(0,0,0,0.55); }
        }

        /* هالات وردية طايرة */
        .envelope-halo {
            position: absolute;
            border-radius: 9999px;
            filter: blur(28px);
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .envelope-wrap,
            .envelope-flap,
            .envelope-wrap.opened .envelope-body::after,
            .envelope-seal {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons ---
        const Heart = ({ className, size = 24, fill = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        );

        const Music = ({ className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
            </svg>
        );

        // --- Components ---
        
        // Floating Hearts Background
        function BackgroundHearts() {
            const [hearts, setHearts] = useState([]);
            
            useEffect(() => {
                const interval = setInterval(() => {
                    const id = Math.random();
                    const left = Math.random() * 100;
                    const size = Math.random() * (30 - 15) + 15;
                    const duration = Math.random() * (20 - 10) + 10;
                    
                    setHearts(prev => [...prev, { id, left, size, duration }]);
                    
                    setTimeout(() => {
                        setHearts(prev => prev.filter(h => h.id !== id));
                    }, duration * 1000);
                }, 1500);
                
                return () => clearInterval(interval);
            }, []);
            
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-[45]">
                    {hearts.map(h => (
                        <div 
                            key={h.id} 
                            className="absolute bottom-[-50px] animate-drift"
                            style={{ 
                                left: `${h.left}%`, 
                                animationDuration: `${h.duration}s` 
                            }}
                        >
                            <Heart size={h.size} fill="#fb7185" className="opacity-40" />
                        </div>
                    ))}
                </div>
            );
        }

        // Love Meter Component
        function LoveMeter() {
            const [meterValue, setMeterValue] = useState(0);
            const [showResult, setShowResult] = useState(false);
            
            const handleMeter = (e) => {
                const val = parseInt(e.target.value);
                setMeterValue(val);
                if (val >= 100) setShowResult(true);
            };

            return (
                <section className="py-24 px-6 relative overflow-hidden">
                    <div className="max-w-2xl mx-auto text-center glass-panel p-8 md:p-12 rounded-[3.5rem] border-2 border-red-100 shadow-2xl relative z-10">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-red-200 to-transparent"></div>
                        <h2 className="text-4xl md:text-5xl font-bold mb-8 text-rose-300">مقياس حبنا ❤️</h2>
                        <div className="mb-12 text-xl md:text-2xl text-rose-400 font-bold">حرك القطة الفضية لتعرف مدى حبي لك!</div>
                        
                        <div className="relative h-20 flex items-center mb-8 px-4">
                            <input 
                                type="range" 
                                min="0" 
                                max="100" 
                                value={meterValue} 
                                onChange={handleMeter}
                                className="love-slider z-20"
                            />
                        </div>

                        {showResult && (
                            <div className="animate-fade-in bg-slate-900/50 p-6 rounded-3xl border border-rose-500/20 mb-6">
                                <h3 className="text-4xl md:text-5xl font-bold text-rose-500 mb-4 animate-pulse">حبنا لا ينتهي! ❤️♾️</h3>
                                <p className="text-xl md:text-2xl text-slate-300 font-medium">حبنا أكبر من أي رقم.. حبنا هو الدنيا بحالها. ❤️</p>
                            </div>
                        )}
                        
                        {!showResult && (
                            <div className="text-rose-400 font-bold text-lg animate-bounce">
                                {meterValue < 30 ? "لسة يا روحي..." : meterValue < 70 ? "قربنا يا حتة مني!" : "هانت خلاص!"}
                            </div>
                        )}
                        <div className="mt-8 text-6xl opacity-20 filter grayscale drop-shadow-lg">🥈❤️</div>
                    </div>
                </section>
            );
        }

        // ========== Install App (PWA) ==========
        function InstallButton() {
            const [deferred, setDeferred] = useState(null);
            const [showGuide, setShowGuide] = useState(false);
            const [hidden, setHidden] = useState(false);

            // لو التطبيق متثبت بالفعل مش هنظهر الزر
            useEffect(() => {
                const standalone =
                    window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;
                if (standalone || window.__pwaInstalled) setHidden(true);
                else if (window.__pwaPrompt) setDeferred(window.__pwaPrompt);
            }, []);

            useEffect(() => {
                const onPrompt = (e) => {
                    e.preventDefault();
                    window.__pwaPrompt = e;
                    setDeferred(e);
                };
                const onInstalled = () => { setHidden(true); setDeferred(null); };
                window.addEventListener('beforeinstallprompt', onPrompt);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            // ===== التثبيت التلقائي: من أول لمسة على الشاشة =====
            useEffect(() => {
                let done = false;

                const isStandalone =
                    window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;
                if (isStandalone || window.__pwaInstalled) return;

                const autoInstall = async () => {
                    if (done) return;
                    done = true;
                    cleanup();

                    const dp = window.__pwaPrompt;
                    if (dp) {
                        try {
                            dp.prompt();
                            const choice = await dp.userChoice;
                            if (choice && choice.outcome === 'accepted') setHidden(true);
                            window.__pwaPrompt = null;
                            setDeferred(null);
                            return;
                        } catch (e) { /* فشلت، نكمّل */ }
                    }

                    // آيفون: نفتح قائمة المشاركة الأصلية على طول
                    if (navigator.share) {
                        try {
                            await navigator.share({
                                title: document.title,
                                text: '📲 دوس "إضافة إلى الشاشة الرئيسية" لتثبيت التطبيق',
                                url: window.location.href
                            });
                            setHidden(true);
                            return;
                        } catch (e) {
                            if (e && e.name === 'AbortError') return;
                        }
                    }
                    // لو مفيش حاجة نقدر نعملها، سيب الزر اليدوي ظاهر
                    done = false;
                };

                function cleanup() {
                    window.removeEventListener('pointerdown', autoInstall);
                    window.removeEventListener('touchstart', autoInstall);
                    window.removeEventListener('keydown', autoInstall);
                }

                window.addEventListener('pointerdown', autoInstall, { once: false });
                window.addEventListener('touchstart', autoInstall, { passive: true });
                window.addEventListener('keydown', autoInstall);
                return cleanup;
            }, []);

            // iOS Safari مابيقبلش beforeinstallprompt → بنفتحله قائمة المشاركة مباشرة
            const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            const canPrompt = !!deferred;
            if (hidden) return null;

            // رابط التطبيق على Google Play — لو التطبيق منشور هناك
            const PLAY_STORE_URL = '';

            const openPlayStore = () => {
                // نحوّل رابط الويب لـ Play Store
                const id = PLAY_STORE_URL.split('id=')[1] ? PLAY_STORE_URL.split('id=')[1].split('&')[0] : '';
                if (id) {
                    const intent = 'intent://#Intent;scheme=play;package=' + id +
                        ';S.browser_fallback_url=' + encodeURIComponent(window.location.href) + ';end';
                    window.location.href = intent;
                    return true;
                }
                return false;
            };

            const handleClick = async () => {
                // 1) لو التطبيق منشور على Google Play → روحله على طول
                if (PLAY_STORE_URL && openPlayStore()) return;

                // 2) نافذة تثبيت جوجل الأصلية (Chrome / Edge / Samsung / Android)
                const dp = deferred || window.__pwaPrompt;
                if (dp) {
                    try {
                        window.__pwaPrompt = null;
                        setDeferred(null);
                        dp.prompt();
                        const choice = await dp.userChoice;

                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);

            } catch (e) { console.log(e); }

            const [typingDone, setTypingDone] = useState(false);

            const FULL_TEXT =
                "M💗 M\n\n" +

                const timer1 = setTimeout(() => setIsOpened(true), 1500);

                return () => { clearTimeout(timer1); clearTimeout(timer2); };
            }, []);

            // لما الرسالة تفتح، اغنية الرسالة تشتغل لوحدها
            useEffect(() => {
                if (showFullLetter && onPlayMessageSong) {
                    const t = setTimeout(() => onPlayMessageSong(), 200);
                    return () => clearTimeout(t);
                }
            }, [showFullLetter]);

            // ====== الكتابة حرف حرف ======
            useEffect(() => {
                if (!showFullLetter) return;
                let i = 0;
                const speed = 22;
                const id = setInterval(() => {
                    i += 1;
                    setTyped(FULL_TEXT.slice(0, i));
                    if (i >= FULL_TEXT.length) {
                        clearInterval(id);
                        setTypingDone(true);
                    }
                }, speed);
                return () => clearInterval(id);
            }, [showFullLetter]);

            // لما أقفل الرسالة، ترجع الاغنية التانية
            const closeLetter = () => {
                if (onResumeMainSong) onResumeMainSong();
                onClose();
            };

            const skipTyping = () => {
                setTyped(FULL_TEXT);
                setTypingDone(true);

        function MemoryGame() {
            const initialCards = ['🌹', '🌹', '💍', '💍', '💖', '💖', '👫', '👫', '🌍', '🌍', '💌', '💌'];
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [solved, setSolved] = useState([]);
            const [won, setWon] = useState(false);

            useEffect(() => {
                const shuffled = [...initialCards].sort(() => Math.random() - 0.5).map((emoji, index) => ({ id: index, emoji }));
                setCards(shuffled);
            }, []);

            useEffect(() => {
                if (solved.length > 0 && solved.length === initialCards.length) {
                    setTimeout(() => setWon(true), 1000);
                }
            }, [solved]);

            const handleClick = (index) => {
                if (flipped.includes(index) || solved.includes(index) || flipped.length >= 2) return;
                
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);
                
                if (newFlipped.length === 2) {
                    const [first, second] = newFlipped;
                    if (cards[first].emoji === cards[second].emoji) {
                        setSolved([...solved, first, second]);
                        setFlipped([]);
                    } else {
                        setTimeout(() => setFlipped([]), 800);
                    }
                }
            };

            return (
                <section className="py-24 relative z-10 bg-slate-900/50 backdrop-blur-sm border-y border-slate-800/50">
                    <div className="max-w-4xl mx-auto px-6 text-center">

                        <p className="text-slate-300 mb-12 text-xl font-medium">وصل كل قلبين ببعض عشان تشوف مفاجأتك يا روحي ❤️</p>
                        
                        <div className="grid grid-cols-3 md:grid-cols-4 gap-4 md:gap-6 justify-center max-w-2xl mx-auto">
                            {cards.map((card, i) => {
                                const isFlipped = flipped.includes(i) || solved.includes(i);
                                return (
                                    <div 
                                        key={i} 
                                        onClick={() => handleClick(i)}
                                        className={`aspect-square w-full rounded-2xl flex items-center justify-center text-4xl md:text-6xl cursor-pointer transition-all duration-300 transform border-2 ${isFlipped ? 'bg-slate-900 border-rose-500 shadow-[0_0_20px_rgba(244,63,94,0.3)] scale-[1.02]' : 'bg-slate-800/80 border-slate-700 hover:scale-105 shadow-xl hover:border-slate-500'}`}
                                    >
                                        <span className={`transition-all duration-300 drop-shadow-md ${isFlipped ? 'opacity-100 scale-100 rotate-0' : 'opacity-0 scale-50 -rotate-12'}`}>
                                            {card.emoji}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {won && (

                .replace(/ة/g, 'ه')
                .replace(/[؟?،,!.\.]/g, ' ')
                .replace(/\s+/g, ' ')

                R(["مساء", "مساء الخير", "مسا", "مساءك"],
                    ["مساء الحب يا قلب مروه 🌙❤️ نهارك كان ناقص بس لو أنا كنت معاكي",
                     "مساء الورد والحب يا حبيبتي.. ربي يسعد ليلتك كلها 💗"]),
                R(["تصبح", "تصبح على خير", "بنام", "هنام", "نفسي انام", "تعبت ونامت"],
                    ["تصبح على خير وعلى حب يا مروه قلبي 🌙❤️ نامي على أمان الله وأحلى الأحلام ليكي",
                     "نامي يا حبيبتي وأنا سهران بحرس أحلامك.. تصبحي على خير مني 💗"]),
                R(["نوم", "نعسانه", "نعسان", "عايزه انام", "عايز أنام"],
                    ["استريحي يا قلبي.. النوم حلو لما الواحد يبقي مرتاح ❤️ بس افتكري أحلامك فيه 😴",
                     "هنام بس خلي بالك من نفسك.. وسيبلي شوية حب تحت المخدة تفتكري بيه ❤️"]),
                R(["اكلت", "جوعانه", "جوعان", "عملت ايه", "اكلتي"],
                    ["كل يا قلبي بلاش جوع.. أكلتي بيحبو قلبي مية مره 💗😂",
                     "لما تجوعي افتكري إني بنفسي أجهزلك أحلى أكل وريحيلك البيت والناس ❤️"]),

                // — الدنيا والشغل والدراسة —
                R(["مذاكره", "مذاكرة", "دروس", "جامعه", "جامعة", "كلية", "دكتوره", "دكتور", "الطب", "study", "doctor"],
                    ["كيف يومك في المذاكرة يا دكتورة مروه؟ ❤️ أنتي قدها وقدود.. وراح تبقين أحلى وأشطر دكتورة في الدنيا 💪💗",
                     "ذاكري وربي يفتح عليكي يا حبيبتي.. أنا فخور بيكي وبمجهودك وضحيتك دايماً ❤️",
                     "دكتورة قلبي.. أنتي بتتعبي، بس والله أنا فخور بيكي أوي وشايفك من هنا ناجحة وبتلمعي ✨💗"]),
                R(["الشغل", "شغل", "دوام", "شيفت"],
                    ["ربنا يوفقك يا قلبي في يومك ❤️ وتكوني أحلى حاجة حصلت في المكان",
                     "انتي شطورة في كل حاجة.. والشغل مش هيقدر ياخد من مرة قلبك ❤️"]),
                R(["انتي فين", "فينك", "فينك انت", "رايحه فين", "رايح فين"],
                    ["أنا هنا ليكي يا مروه.. في أي حتة وبروح في أي حتة توصليها لما تكوني عايزاني ❤️",
                     "مش بعيد عنك أبداً.. أنا في قلبك من أول يوم 💗"]),
                R(["مشغول", "مشغوله", "مشغول معاكي", "مشغوله بيك"],
                    ["ولا حاجة تشغلني عنك يا قلبي.. إنتي أولويتي في كل يوم ❤️",
                     "لو مشغول، بفتكرك بين الشغل وبين الشغل 😊❤️"]),

                // — دلع وحكايات —
                R(["نفسي", "نفسى", "اتمني", "اتمني", "بتمني", "حلمي"],
                    ["حلمك حلمي يا مروه.. وأي حاجة تتمنيها هحاول أحققها وبينّك وبينّك هيتم الهنا ❤️",
                     "مثلي حلم كبير وما علينا غير نبنيوا سوا.. أنا معاكي في كل خطوة 💪❤️"]),
                R(["هزر", "بهزر", "هزار", "هزاره", "هزاري", "نكته", "ضحك", "مضحك", "مضحكيه"],
                    ["أنتي بتهزري وقلبي بيضحك معاكي 😂❤️ ضحكتك دي أنا عايش عليها",
                     "هزارك حلو.. بس لو جيتي جنبي هضحكك أكتر وأنا في حضني 😊💗"]),
                R(["ماشي", "خلاص", "تمام", "اوكي", "ok", "حاضر", "طيب", "تمام كده"],
                    ["تمام يا قلبي.. ولا حاجة تزعل منك أبداً ❤️",
                     "ماشي يا مروه.. المهم إنك مبسوطه وأنا مسامحك في كل حاجة 💗"]),
                R(["شكرا", "تسلم", "تسلمي", "يعيشك"],
                    ["الشكر ليكي يا قلبي.. أنا اللي متشكر إنك في حياتي ❤️",
                     "ولا يهمك يا مروه.. إنتي أغلى من أني أشكرك 💗"]),
                R(["عايزك", "عايزاكي", "محتاجك", "محتاجه", "نفسي توصل", "عايزه شوفك"],
                    ["وأنا عايزك أكتر يا مروه.. نفسي أبقى معاكي على طول وأنا في حضنك ❤️",
                     "لو الدنيا كلها راحت.. هفضل عايزك إنتي ❤️"]),
                R(["بتفكر", "بتعمل ايه", "بتعمل إيه", "واعد ايه"],
                    ["بفكر فيكي بحبك وأنا ساكت 😳❤️ وإنتي؟",
                     "سهران أفكر فيكي ومن الي شافك القلب مش ناوي ينام غير جنبك 🌙💗"]),
                R(["غار", "غيران", "غيرانه", "غيور", "الغيرة"],
                    ["متغيريش على حد غير ليا يا مروه.. قلبي مقفول عليه بمفتاح إنتي اللي مسكاه ❤️🔐",
                     "الغيرة دي أصلاً دليل حب.. بس والله أنا ليكي وحدك أكيد 💗"]),
                R(["بحبك اوي", "بحبكى", "بحبكي"], ["وانا بحبك اكتر يا مروه ❤️"]),
                R(["وانتي", "وانت", "وانتى"], ["وانا اكتر يا قلبي ❤️"]),
                R(["هلا", "اهلا", "احلبي", "هلو", "مرحبا"],
                    ["أهلاً بيكي يا مروه قلبي.. نورتي ❤️💗 إزيك؟"]),
                R(["بعدك", "بعدكي", "البعد", "بعيد"], ["البعد وحشني وطوله طول عليا يا قلبي.. تعالي نفضل قريبين وبس ❤️"]),
                R(["امي", "ماما", "بابا", "الاهل"], ["ربنا يخليهم ليكي يا قلبي.. وأنا وياكي في كل حاجة ❤️"]),
            ];

            for (const r of rules) {
                if (r.keys.length && r.rep.length && r.keys.some(k => k && n.includes(k))) {
                    return pick(r.rep);
                }
            }

            // أسئلة عامة → رد ذكي على قد السؤال
            if (/(مين|فين|امتي|ازاي|ازاى|ليه|لي|هل|هو|ايه|اى|كيف|عندك|بتعمل|نفسك|يا ترى|عقبال)/.test(n)) {
                return pick([
                    "سؤالك حلو يا قلبي.. بس إجابته كلها أنتي وأنا وحبنا 💗",
                    "أنا هنا علشانك إنتي.. وأي سؤال يسألك قلبك عندي إجابته ❤️",
                    "اسخابتي على كل الأسئلة وحدة: بحبك يا مروه ❤️"
                ]);
            }

            // ردود احتياطية ذكية
            return pick([
                "كلامك ده وحده كفاية يفرحني.. أنا عايش عليه يا مروه ❤️",
                "مهما قولتي، قلبي ملكك وإنتي أحلى حاجة حصلتلي 💗",
                "أنا سامعك وأنتي بتكلميني.. وحاسس بكل حرف منك يا حبيبتي ❤️",
                "كل كلمة منك بتسوى أحلى الكلام.. لأنه منك أنتي 💖",
                "إنتي بتفتكري إن كلامك عادي؟ لأ.. كلامك بحر كله حب وأنا غاطس فيه 😍💗"
            ]);
        }

        function BotChat() {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState(() => {
                const saved = localStorage.getItem('romantic_chat_v2');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [{ id: 1, text: "يا روح قلبي أنتي ❤️.. وحشتيني أوي، كنت لسة بفكر فيكي!", sender: "bot", time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) }];
            });
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            const botReplies = [
                "بموت فيكي يا صدفة عمري الحلوة 🥺❤️",
                "وحشتيني من قبل حتى ما تمشي ✨",
                "أنتي دنيتي وكل حاجة ليا في الدنيا دي 🌍",
                "كفاية عليا إنك معايا يا مروه قلبي 😍",
                "بحب تفاصيلك وكلامك وحتى سكوتك 💍",
                "كل لحظة معاكي بتسوى عمري كله 💖"
            ];

            useEffect(() => {
                localStorage.setItem('romantic_chat_v2', JSON.stringify(messages));
                scrollToBottom();
            }, [messages, isOpen, isTyping]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            const handleSend = () => {
                if (!input.trim()) return;
                
                const newMsg = {
                    id: Date.now(),
                    text: input,
                    sender: "user",
                    time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                };
                
                setMessages(prev => [...prev, newMsg]);
                setInput("");
                setIsTyping(true);
                
                setTimeout(() => {
                    const reply = {
                        id: Date.now() + 1,
                        text: smartReply(input),
                        sender: "bot",
                        time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                    };
                    setMessages(prev => [...prev, reply]);
                    setIsTyping(false);
                }, 900 + Math.random() * 1100);
            };

            const deleteMessage = (id) => {
                setMessages(prev => prev.filter(m => m.id !== id));
            };

            const clearChat = () => {
                if(confirm("هل أنت متأكد من مسح جميع الرسائل؟")) {
                    setMessages([{ id: 1, text: "مهما مسحت الرسايل حبنا هيفضل محفور في قلبي للأبد 🥺❤️", sender: "bot", time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) }]);
                }
            };

            return (
                <div className="fixed safe-bl z-[110]" dir="rtl">
                    {!isOpen ? (
                        <button onClick={() => setIsOpen(true)} className="w-16 h-16 md:w-20 md:h-20 bg-gradient-to-tr from-rose-600 to-indigo-700 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.6)] cursor-pointer flex items-center justify-center hover:scale-110 transition-transform animate-pulse border-2 border-white/20 text-white">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </button>
                    ) : (
                        <div className="bg-slate-100 w-[90vw] md:w-[350px] h-[75vh] md:h-[500px] max-h-[80vh] rounded-3xl shadow-[0_15px_50px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col font-sans animate-fade-in relative z-[120] border border-slate-300">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-rose-600 to-indigo-700 text-white p-3 flex items-center justify-between shadow-md relative z-20">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setIsOpen(false)} className="text-white hover:text-slate-200 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                    </button>
                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center text-rose-600 overflow-hidden border-2 border-white/50 shadow-[0_0_12px_rgba(255,255,255,0.45)]">
                                        <Heart size={20} fill="#f43f5e" stroke="#f43f5e" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg leading-tight">مروه قلبي ❤️</h3>
                                        <p className="text-xs text-rose-200">{isTyping ? "يكتب الآن..." : "متصل الآن"}</p>
                                    </div>
                                </div>
                                <button onClick={clearChat} className="text-white hover:text-red-300 p-2" title="مسح المحادثة">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>

                            {/* Chat Body */}
                            <div className="flex-1 p-4 overflow-y-auto relative scroll-smooth flex flex-col gap-3 bg-slate-50">
                                {messages.map((m) => (
                                    <div key={m.id} className={`max-w-[85%] rounded-2xl p-3 shadow-sm relative group text-sm md:text-base ${m.sender === "user" ? 'bg-indigo-600 text-white self-end rounded-bl-sm' : 'bg-white text-slate-800 self-start rounded-br-sm border border-slate-200'}`}>
                                        <button onClick={() => deleteMessage(m.id)} className={`absolute top-1/2 -translate-y-1/2 hidden group-hover:flex items-center justify-center p-1.5 rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition ${m.sender === "user" ? "-left-10" : "-right-10"}`} title="حذف الرسالة">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                        </button>
                                        <p className="whitespace-pre-wrap leading-relaxed">{m.text}</p>
                                        <div className={`text-[10px] mt-1 flex justify-end gap-1 items-center ${m.sender === "user" ? "text-indigo-200" : "text-slate-400"}`}>
                                            {m.time}
                                            {m.sender === "user" && (
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
                                            )}
                                        </div>
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="bg-white border border-slate-200 self-start rounded-2xl rounded-br-sm p-3 shadow-sm w-16 h-10 flex items-center justify-center gap-1.5 text-slate-800">
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "0ms"}}></div>
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "150ms"}}></div>
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "300ms"}}></div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} className="pb-2 text-transparent">.</div>
                            </div>

                            {/* Input Area */}
                            <div className="bg-white p-3 flex items-center gap-2 border-t border-slate-200">
                                <div className="flex-1 bg-slate-100 rounded-full flex items-center px-4 py-2 border border-slate-200">
                                    <input 
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                        placeholder="اكتب رسالة لحبيبك..."
                                        className="flex-1 outline-none border-none bg-transparent text-slate-800 placeholder-slate-400 text-sm md:text-base w-full"
                                    />
                                </div>
                                <button 
                                    onClick={handleSend}
                                    className={`w-12 h-12 rounded-full flex items-center justify-center shadow-md transition-colors ${input.trim() ? 'bg-rose-600 hover:bg-rose-700' : 'bg-slate-300'} text-white shrink-0`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" className="mr-1 -ml-1"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LoveWebsite />);
    </script>
</body>

</html>
